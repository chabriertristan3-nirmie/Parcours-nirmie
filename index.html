<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirmie - Créer mon parcours</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Quicksand', 'sans-serif'],
            },
            colors: {
              nirmie: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981', // Nirmie Green Signature
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
      }
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page { 
          size: A4; 
          margin: 10mm; 
        }
        
        body { 
          background-color: white; 
          -webkit-print-color-adjust: exact; 
          print-color-adjust: exact;
          color: black;
        }

        /* Hide interactive elements */
        .no-print, button, header, .leaflet-control-zoom, .leaflet-control-attribution { 
          display: none !important; 
        }
        
        .print-only { 
          display: block !important; 
        }

        #root { 
          width: 100%; 
          margin: 0; 
          padding: 0; 
        }

        /* Reset styles for printing readability */
        .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl { 
          box-shadow: none !important; 
          border: 1px solid #eee; 
        }

        /* Map specific print styles */
        #map-container {
          height: 400px !important;
          width: 100% !important;
          page-break-inside: avoid;
          border: 2px solid #ccc;
          margin-bottom: 20px;
        }
        
        /* Ensure step items don't break awkwardly */
        .step-item {
          break-inside: avoid;
          page-break-inside: avoid;
          border-bottom: 1px solid #eee;
          padding-bottom: 10px;
          margin-bottom: 10px;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
